<!DOCTYPE html>
<html>
<head>
    <title>Streamer Live Test</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #181818;
        }

        h1 {
            margin: 0;
        }

        .timer {
            margin-top: 10px;
            font-size: 24px;
            color: #00ff88;
        }

        .chat {
            max-width: 600px;
            margin: 30px auto;
            height: 500px;
            overflow: hidden;
            padding: 20px;
            background: #222;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .message {
            background: #333;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            animation: appear 0.3s;
        }

        .username {
            font-weight: bold;
            color: #00ff88;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

    </style>
</head>


<body>


<div class="header">

<h1>STREAMER LIVE TEST</h1>

<div class="timer">
05:00
</div>

</div>



<div class="chat" id="chat">

</div>


<div class="status">
TEST STARTED
</div>



<script>

let seconds = 300;


const messages = [

{
name: "user123",
text: "Hello bang, first time here"
},

{
name: "trader01",
text: "What is your analysis today?"
},

{
name: "crypto_master",
text: "Can you explain this entry?"
},

{
name: "newbie88",
text: "Is this safe for beginners?"
},

{
name: "market_pro",
text: "Why did you choose this direction?"
},

{
name: "andi_fx",
text: "How long will this trade take?"
},

{
name: "profit_hunter",
text: "Can I follow this setup?"
},

{
name: "user777",
text: "Please explain your strategy"
}

];



function addMessage(){

let random = messages[Math.floor(Math.random() * messages.length)];


let chat = document.getElementById("chat");


let div = document.createElement("div");

div.className = "message";


div.innerHTML =
`
<span class="username">@${random.name}</span><br>
${random.text}
`;


chat.appendChild(div);


if(chat.children.length > 8){
    chat.removeChild(chat.children[0]);
}


}




function updateTimer(){

seconds--;


let minutes = Math.floor(seconds / 60);

let sec = seconds % 60;


document.querySelector(".timer").innerHTML =
`${minutes}:${sec.toString().padStart(2,"0")}`;



if(seconds <= 0){

document.querySelector(".status").innerHTML =
"TEST COMPLETED";

clearInterval(timer);

}

}




let timer = setInterval(updateTimer,1000);



setInterval(addMessage,20000);


addMessage();


</script>


</body>
</html>
