<!DOCTYPE html>
<html>
<head>
    <title>Streamer Live Test</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: #181818;
        }

        h1 {
            margin: 0;
        }

        .timer {
            margin-top: 10px;
            font-size: 24px;
            color: #00ff88;
        }

        .chat {
            max-width: 600px;
            margin: 30px auto;
            height: 500px;
            overflow: hidden;
            padding: 20px;
            background: #222;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .message {
            background: #333;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            animation: appear 0.3s;
        }

        .username {
            font-weight: bold;
            color: #00ff88;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        #startButton {
            margin-top: 20px;
            padding: 15px 60px;
            font-size: 22px;
            background: #00ff88;
            color: #111;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        #startButton:hover {
            transform: scale(1.05);
        }

    </style>
</head>


<body>


<div class="header">

    <h1>STREAMER LIVE TEST</h1>

    <div class="timer">
        05:00
    </div>

    <div class="buttons">

<button id="startButton" onclick="startTest()">
START TEST
</button>

<button id="finishButton" onclick="finishTest()" style="display:none;">
FINISH TEST
</button>

<button id="restartButton" onclick="restartTest()" style="display:none;">
RESTART TEST
</button>

</div>

</div>



<div class="chat" id="chat">

</div>



<div class="status">
    READY TO START
</div>



<script src="script.js"></script>


</body>
</html>
